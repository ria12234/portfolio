<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Security Console — Demo</title><link rel="stylesheet" href="../assets/style.css"></head><body class="theme-cyber"><main class="demo-body"><header class="demo-header"><div><p class="eyebrow">INDEPENDENT DEMO / FICTIONAL DATA</p><h1>Security Console<span style="color:var(--accent)">.</span></h1></div><a href="../index.html">← ALL DESIGNS</a></header><div class="note" style="margin-bottom:24px">これはポートフォリオ用の自主制作デモです。実際の顧客システム、セキュリティ監視情報、IoT機器には接続していません。</div><div class="dashboard"><div class="metric"><small>EVENTS / TODAY</small><span class="number" id="events">12</span><small>仮想イベント数</small></div><div class="metric"><small>HIGH PRIORITY</small><span class="number" id="high">2</span><small>重要度 HIGH</small></div><div class="metric"><small>MONITOR STATUS</small><span class="number" style="font-size:27px">ONLINE</span><small>simulation only</small></div><div class="demo-panel"><div class="section-heading" style="margin-bottom:8px"><h2 style="font-size:23px">Event stream</h2><span class="badge-demo">● SIMULATED</span></div><div class="demo-controls"><button id="add">GENERATE EVENT +</button><button data-sev="ALL">ALL</button><button data-sev="HIGH">HIGH ONLY</button><button id="clear">RESET</button></div><div style="overflow-x:auto"><table class="demo-table"><thead><tr><th>TIME</th><th>EVENT</th><th>SOURCE</th><th>SEVERITY</th></tr></thead><tbody id="rows"></tbody></table></div></div></div></main><script>const original=[['09:14:23','New session','device-04','LOW'],['09:16:11','Repeated failed login','gateway-01','HIGH'],['09:18:04','Configuration changed','sensor-12','MEDIUM'],['09:19:20','Unusual connection pattern','gateway-02','HIGH']];let data=[...original],filter='ALL';const events=['Session opened','Unexpected port request','Failed authentication','Configuration update','Policy matched'];let seq=0;function render(){document.getElementById('events').textContent=data.length+8;document.getElementById('high').textContent=data.filter(x=>x[3]==='HIGH').length;document.getElementById('rows').innerHTML=data.filter(x=>filter==='ALL'||x[3]===filter).slice().reverse().map(x=>`<tr>${x.map((v,i)=>`<td>${i===3?`<span class="pill">${v}</span>`:v}</td>`).join('')}</tr>`).join('')}document.getElementById('add').onclick=()=>{seq++;data.push([new Date().toLocaleTimeString('ja-JP',{hour12:false}),events[seq%events.length],'node-'+String(10+seq).padStart(2,'0'),['LOW','MEDIUM','HIGH'][seq%3]]);render()};document.getElementById('clear').onclick=()=>{data=[...original];render()};document.querySelectorAll('[data-sev]').forEach(b=>b.onclick=()=>{filter=b.dataset.sev;render()});render();</script></body></html>
