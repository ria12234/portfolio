<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IoT Telemetry — Demo</title><link rel="stylesheet" href="../assets/style.css"></head><body class="theme-cyber"><main class="demo-body"><header class="demo-header"><div><p class="eyebrow">INDEPENDENT DEMO / FICTIONAL DATA</p><h1>IoT Telemetry<span style="color:var(--accent)">.</span></h1></div><a href="../index.html">← ALL DESIGNS</a></header><div class="note" style="margin-bottom:24px">これはポートフォリオ用の自主制作デモです。実際の顧客システム、セキュリティ監視情報、IoT機器には接続していません。</div><div class="dashboard"><div class="metric"><small>TEMPERATURE</small><span class="number" id="temp">24.6°C</span><small>仮想値</small></div><div class="metric"><small>HUMIDITY</small><span class="number" id="humidity">52%</span><small>仮想値</small></div><div class="metric"><small>DEVICE STATUS</small><span class="number" id="state" style="font-size:29px">ONLINE</span><small id="device">sensor-01</small></div><div class="demo-panel"><h2 style="font-size:24px;margin:0">Telemetry</h2><div class="demo-controls"><button data-device="sensor-01">SENSOR 01</button><button data-device="sensor-02">SENSOR 02</button><button data-device="sensor-03">SENSOR 03</button><button id="sample">GENERATE SAMPLE</button><button id="toggle">TOGGLE ONLINE</button></div><div class="chart-bars" id="bars" role="img" aria-label="生成した温度サンプルの棒グラフ"></div><div class="log-area" id="log"></div></div></div></main><script>let current=0,online=true,count=0;const sensors=[{id:'sensor-01',t:24.6,h:52},{id:'sensor-02',t:21.2,h:61},{id:'sensor-03',t:28.3,h:44}],bars=document.getElementById('bars');let vals=[21,22,23,24,22,25,23,24,26,24,25,24];function paint(){const s=sensors[current];document.getElementById('temp').textContent=s.t.toFixed(1)+'°C';document.getElementById('humidity').textContent=s.h+'%';document.getElementById('device').textContent=s.id;document.getElementById('state').textContent=online?'ONLINE':'OFFLINE';bars.innerHTML=vals.map(x=>`<span style="height:${Math.max(8,x*2.7)}%" title="${x}°C"></span>`).join('');document.getElementById('log').textContent=`DEVICE ${s.id} / STATUS ${online?'ONLINE':'OFFLINE'} / SAMPLES ${count} / DATA: SIMULATED`};document.querySelectorAll('[data-device]').forEach((b,i)=>b.onclick=()=>{current=i;online=true;paint()});document.getElementById('sample').onclick=()=>{if(!online)return;const s=sensors[current];count++;s.t=Math.max(15,Math.min(35,s.t+(count%2?.7:-.4)));s.h=Math.max(20,Math.min(80,s.h+(count%2?1:-2)));vals=[...vals.slice(1),s.t];paint()};document.getElementById('toggle').onclick=()=>{online=!online;paint()};paint();</script></body></html>
