<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Layout Repair — Demo</title><link rel="stylesheet" href="../assets/style.css"></head><body class="theme-cyber"><main class="demo-body"><header class="demo-header"><div><p class="eyebrow">INDEPENDENT DEMO / FICTIONAL DATA</p><h1>Layout Repair<span style="color:var(--accent)">.</span></h1></div><a href="../index.html">← ALL DESIGNS</a></header><div class="note" style="margin-bottom:24px">これはポートフォリオ用の自主制作デモです。実際の顧客システム、セキュリティ監視情報、IoT機器には接続していません。</div><div class="demo-panel"><h2 style="font-size:24px;margin:0">Responsive Layout Repair</h2><p class="muted">固定幅のレイアウトによる横はみ出しを、レスポンシブ対応に修正する例。右上の切替で比較できます。</p><div class="demo-controls"><button id="broken">BEFORE / BROKEN</button><button id="fixed">AFTER / FIXED</button></div><div class="fix-frame broken" id="frame"><div class="fix-content"><div class="fake-img"></div><div class="fix-text"><h2>Web制作とレイアウト調整</h2><p>狭い画面で表示が崩れる状態を再現したサンプルです。</p><button style="padding:10px;background:#395f50;color:white;border:0">詳しく見る</button></div></div></div><p class="badge-demo" id="status">BEFORE / fixed width: 850px</p></div></main><script>const f=document.getElementById('frame');document.getElementById('broken').onclick=()=>{f.className='fix-frame broken';document.getElementById('status').textContent='BEFORE / fixed width: 850px'};document.getElementById('fixed').onclick=()=>{f.className='fix-frame fixed';document.getElementById('status').textContent='AFTER / fluid width + wrapping'};</script></body></html>
